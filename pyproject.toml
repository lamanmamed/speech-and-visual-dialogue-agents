[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-and-visual-dialogue-agents"
version = "0.1.0"
description = "Dialogue agents for speech, clarification, multi-party turn-taking, and visual guessing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "torch>=2.0",
]

[project.optional-dependencies]
models = [
    "datasets>=3.6",
    "evaluate>=0.4",
    "gTTS>=2.5",
    "jiwer>=3.0",
    "openai-whisper>=20240930",
    "peft>=0.14",
    "scikit-learn>=1.3",
    "transformers>=4.50",
    "trl>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]
